name: Keepalive
on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:
jobs:
  keepalive:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Empty commit to keep scheduled workflows alive
        run: |
          git config user.name suhaasdev
          git config user.email sreesuhaas04@gmail.com
          git commit --allow-empty -m "chore: keepalive"
          git push
